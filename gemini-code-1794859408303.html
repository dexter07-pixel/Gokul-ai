<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Gokul AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100dvh; }
    header { padding: 12px 16px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    header h1 { font-size: 1.1rem; color: #38bdf8; white-space: nowrap; }
    .header-controls { display: flex; align-items: center; gap: 8px; }
    #pinInput { background: #0f172a; border: 1px solid #475569; color: #fff; padding: 6px 10px; border-radius: 6px; width: 100px; font-size: 0.85rem; }
    #ttsToggle { background: #0f172a; border: 1px solid #475569; color: #94a3b8; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    #ttsToggle.active { border-color: #38bdf8; color: #38bdf8; background: #0c4a6e; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 820px; width: 100%; margin: 0 auto; }
    .msg { padding: 12px 16px; border-radius: 12px; line-height: 1.5; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; font-size: 0.95rem; }
    .user { background: #2563eb; align-self: flex-end; border-bottom-right-radius: 2px; }
    .ai { background: #1e293b; border: 1px solid #334155; align-self: flex-start; border-bottom-left-radius: 2px; }
    form { display: flex; gap: 8px; padding: 12px; background: #1e293b; border-top: 1px solid #334155; }
    .input-wrap { display: flex; gap: 8px; max-width: 820px; width: 100%; margin: 0 auto; align-items: center; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; min-width: 0; }
    button.action-btn { padding: 12px 16px; border: none; border-radius: 8px; background: #38bdf8; color: #0f172a; font-weight: 700; cursor: pointer; white-space: nowrap; }
    button#micBtn { padding: 12px 14px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #f8fafc; font-size: 1.05rem; cursor: pointer; transition: 0.2s; }
    button#micBtn.listening { background: #dc2626; border-color: #ef4444; animation: pulse 1.2s infinite; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Gokul AI</h1>
    <div class="header-controls">
      <button type="button" id="ttsToggle" title="Toggle Voice Replies">🔇 Voice Off</button>
      <input type="password" id="pinInput" placeholder="Access PIN" />
    </div>
  </header>

  <div id="chat">
    <div class="msg ai">Hello! I am Gokul AI. Enter your Access PIN, then type or tap the 🎤 mic button to speak any command.</div>
  </div>

  <form id="chatForm">
    <div class="input-wrap">
      <button type="button" id="micBtn" title="Speak Command">🎤</button>
      <input type="text" id="promptInput" placeholder="Ask or speak anything..." required autocomplete="off" />
      <button type="submit" id="sendBtn" class="action-btn">Send</button>
    </div>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('chatForm');
    const promptInput = document.getElementById('promptInput');
    const pinInput = document.getElementById('pinInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const ttsToggle = document.getElementById('ttsToggle');

    let history = [];
    let ttsEnabled = localStorage.getItem('gokul_tts') === 'true';

    // Restore saved PIN & Voice preference
    pinInput.value = localStorage.getItem('gokul_pin') || '';
    pinInput.addEventListener('change', () => localStorage.setItem('gokul_pin', pinInput.value));

    function updateTtsUI() {
      ttsToggle.textContent = ttsEnabled ? '🔊 Voice On' : '🔇 Voice Off';
      ttsToggle.classList.toggle('active', ttsEnabled);
      if (!ttsEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }
    updateTtsUI();

    ttsToggle.addEventListener('click', () => {
      ttsEnabled = !ttsEnabled;
      localStorage.setItem('gokul_tts', ttsEnabled);
      updateTtsUI();
    });

    // Text-to-Speech Function
    function speakText(text) {
      if (!ttsEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      // Strip markdown symbols (*, #, `) for cleaner speech
      const cleanText = text.replace(/[*#`]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 1.05;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // Speech-to-Text (Microphone) Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        promptInput.placeholder = 'Listening...';
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        promptInput.value = transcript;
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        promptInput.placeholder = 'Ask or speak anything...';
        // Auto-submit if voice captured text
        if (promptInput.value.trim()) {
          form.dispatchEvent(new Event('submit'));
        }
      };

      recognition.onerror = (event) => {
        isListening = false;
        micBtn.classList.remove('listening');
        promptInput.placeholder = 'Mic error: ' + event.error;
      };

      micBtn.addEventListener('click', () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (isListening) {
          recognition.stop();
        } else {
          promptInput.value = '';
          recognition.start();
        }
      });
    } else {
      micBtn.style.display = 'none'; // Hide if browser doesn't support SpeechRecognition
    }

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = `msg ${cls}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = promptInput.value.trim();
      if (!text) return;

      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      addMsg(text, 'user');
      promptInput.value = '';
      sendBtn.disabled = true;
      micBtn.disabled = true;
      const loading = addMsg('Searching web & thinking...', 'ai');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history, pin: pinInput.value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');

        loading.textContent = data.reply;
        history.push({ role: 'user', text }, { role: 'ai', text: data.reply });
        speakText(data.reply);
      } catch (err) {
        loading.textContent = '⚠️ ' + err.message;
      } finally {
        sendBtn.disabled = false;
        micBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
